<!DOCTYPE html>
<html lang="{{ sprache }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1416">
  <title>{{ anzeigename }}</title>
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <link rel="icon" href="{{ statisch('favicon.png') }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ statisch('icon-180.png') }}">
  <link rel="stylesheet" href="{{ statisch('style.css') }}">
  <script nonce="{{ csp_nonce }}">
    // Vor dem ersten Anstrich: sonst blitzt kurz die falsche Helligkeit auf
    try {
      var w = localStorage.getItem("chat-thema");
      if (w === "hell" || w === "dunkel") {
        document.documentElement.setAttribute("data-thema", w);
      }
    } catch (e) { /* privates Fenster: dann eben wie das Geraet */ }
  </script>
</head>
<body data-base="{{ base }}" data-me="{{ me.id }}" data-name="{{ me.display_name }}"
      data-admin="{{ 1 if me.is_admin else 0 }}" data-vapid="{{ vapid }}"
      data-sprache="{{ sprache }}">

  <div class="app" id="app">
    <aside class="sidebar">
      <header>
        <span class="brand" id="marke">{{ anzeigename }}</span>
        <button class="icon-btn" id="btn-new" title="{{ t('Neue Unterhaltung') }}">{{ t("+ Neu") }}</button>
      </header>
      <nav class="reiter" id="reiter">
        <button class="reiter-knopf" data-reiter="chats">{{ t("Unterhaltungen") }}<span
          class="reiter-zahl" id="zahl-chats"></span></button>
        <button class="reiter-knopf" data-reiter="karten">{{ t("Karten") }}<span
          class="reiter-zahl" id="zahl-karten"></span></button>
        <button class="reiter-knopf" data-reiter="stimmung">{{ t("Stimmung") }}<span
          class="reiter-zahl" id="zahl-stimmung"></span></button>
        <button class="reiter-knopf" data-reiter="termine">{{ t("Termine") }}<span
          class="reiter-zahl" id="zahl-termine"></span></button>
        <button class="reiter-knopf" data-reiter="tipps">{{ t("Tipps") }}<span
          class="reiter-zahl" id="zahl-tipps"></span></button>
      </nav>
      <div class="seiten-scroll">
        <section class="abschnitt" data-inhalt="chats">
          <div class="room-list" id="rooms"></div>
        </section>
        <section class="abschnitt" data-inhalt="karten">
          <div class="abschnitt-aktion">
            <button class="mini-btn" id="btn-live">{{ t("Standort teilen") }}</button></div>
          <div id="karten-liste"></div>
        </section>
        <section class="abschnitt" data-inhalt="stimmung">
          <div class="abschnitt-aktion">
            <button class="mini-btn" id="btn-stimmung">{{ t("Stimmung setzen") }}</button></div>
          <div id="stimmung-liste"></div>
        </section>
        <section class="abschnitt" data-inhalt="termine">
          <div class="abschnitt-aktion">
            <button class="mini-btn" id="btn-termin-frei">{{ t("Termin ohne Unterhaltung") }}</button></div>
          <div class="kf-zeile" id="termin-filter"></div>
          <div id="termin-liste"></div>
        </section>
        <section class="abschnitt" data-inhalt="tipps">
          <div class="abschnitt-aktion">
            <button class="mini-btn" id="btn-tipp">{{ t("Empfehlung schreiben") }}</button></div>
          <div class="kf-zeile" id="tipp-filter"></div>
          <div class="kf-zeile" id="tipp-naehe"></div>
          <div id="tipp-liste"></div>
        </section>
      </div>
      <footer>
        <span class="dot on"></span>
        <span id="me-name">{{ me.display_name }}</span>
        <span style="flex:1"></span>
        <button class="icon-btn" id="btn-meine-galerie"
                title="{{ t('Deine Bilder und Filme') }}">{{ t("Galerie") }}</button>
        <button class="icon-btn" id="btn-freunde" title="Freunde">{{ t("Freunde") }}</button>
        <button class="icon-btn" id="btn-settings" title="{{ t('Einstellungen') }}">…<span
          class="antrags-zahl" id="antrags-zahl" hidden></span></button>
      </footer>
    </aside>

    <main class="chat">
      <div class="chat-header" id="chat-header" hidden>
        <button class="icon-btn back" id="btn-back">←</button>
        <span id="room-avatar"></span>
        <div class="kopf-namen">
          <div class="titelzeile">
            <div class="title" id="room-title"></div>
            <button class="galerie-link" id="btn-galerie" hidden>🎞️ Galerie</button>
          </div>
          <div class="sub" id="room-sub"></div>
        </div>
        <span style="flex:1"></span>
        <button class="icon-btn" id="btn-suche" title="{{ t('Im Verlauf suchen') }}">🔍</button>
        <button class="icon-btn" id="btn-anruf" title="{{ t('Anrufen') }}">📞</button>
        <button class="icon-btn" id="btn-video" title="{{ t('Videoanruf') }}">🎥</button>
        <button class="icon-btn" id="btn-room-media" title="{{ t('Bilder und Dateien dieser Unterhaltung') }}"><span
          class="lang">{{ t("Medien") }}</span><span class="kurz" aria-hidden="true">🖼</span></button>
        <button class="icon-btn" id="btn-invite" title="{{ t('Person hinzufügen') }}" hidden><span
          class="lang">{{ t("+ Person") }}</span><span class="kurz" aria-hidden="true">＋</span></button>
      </div>

      <div class="suchleiste" id="suchleiste" hidden>
        <input id="suche-feld" name="suche" type="search" autocomplete="off"
               aria-label="Im Verlauf suchen"
               data-1p-ignore data-lpignore="true" data-bwignore="true"
               data-form-type="other"
               placeholder="{{ t('Im Verlauf suchen …') }}">
        <label class="check schmal"><input type="checkbox" id="suche-alle">{{ t("Alle Unterhaltungen") }}</label>
        <span class="suche-zahl" id="suche-zahl"></span>
        <button class="icon-btn" id="suche-zu" title="{{ t('Suche schließen') }}">✕</button>
      </div>

      <div class="messages" id="messages">
        <div class="empty">{{ t("Wähle links eine Unterhaltung oder starte mit „+ Neu“ eine neue.") }}</div>
      </div>
      <div class="suchtreffer" id="suchtreffer" hidden></div>
      <div class="sprung" id="sprung" hidden>
        <button class="sprung-knopf" id="sprung-tag"
                title="{{ t('Zum vorigen Tag') }}">↑</button>
        <button class="sprung-knopf" id="sprung-ende"
                title="{{ t('Ans Ende') }}" hidden>↓</button>
      </div>
      <div class="typing" id="typing"></div>

      <div class="reply-bar" id="reply-bar" hidden>
        <div class="reply-body">
          <span class="reply-label">{{ t("Antwort an") }}</span>
          <span id="reply-author"></span>
          <span id="reply-text"></span>
        </div>
        <button class="icon-btn" id="reply-cancel" title="{{ t('Antwort verwerfen') }}">✕</button>
      </div>

      <div class="anhang-menue" id="anhang-menue" hidden>
        <button type="button" data-tat="datei"><span>📎</span>Datei oder Bild</button>
        <button type="button" data-tat="ort"><span>📍</span>Standort senden</button>
        <button type="button" data-tat="live"><span>🛰️</span>Standort live teilen</button>
        <button type="button" data-tat="abstimmung"><span>📊</span>{{ t("Abstimmung") }}</button>
        <button type="button" data-tat="event"><span>📅</span>{{ t("Einladung") }}</button>
      </div>

      <div class="aufnahme-leiste" id="aufnahme-leiste" hidden>
        <span class="aufnahme-punkt"></span>
        <span class="aufnahme-text">{{ t("Halten zum Aufnehmen – Loslassen schickt ab") }}</span>
        <span class="aufnahme-zeit" id="aufnahme-zeit">0:00</span>
        <span style="flex:1"></span>
        <button class="btn ghost klein" id="aufnahme-weg">Verwerfen</button>
      </div>

      <div class="composer" id="composer" hidden>
        <button class="icon-btn" id="btn-emoji" title="{{ t('Emoji') }}">🙂</button>
        <button class="icon-btn" id="btn-anhang" title="{{ t('Anhängen') }}">📎</button>
        <input type="file" id="file-input" multiple hidden>
        <textarea id="input" rows="1" enterkeyhint="send"
                  placeholder="Nachricht schreiben…"></textarea>
        <button class="icon-btn" id="btn-mikro"
                title="{{ t('Zum Aufnehmen gedrückt halten') }}">🎤</button>
        <button class="send" id="btn-send"><span class="lang">{{ t("Senden") }}</span><span
          class="kurz" aria-hidden="true">➤</span></button>
      </div>
    </main>
  </div>

  <div class="schau" id="schau" hidden>
    <div class="schau-kopf">
      <div class="schau-wer">
        <div class="schau-name" id="schau-titel"></div>
        <div class="schau-zeit" id="schau-datum"></div>
      </div>
      <span class="schau-zaehler" id="schau-zaehler"></span>
      <button class="icon-btn" id="schau-zu" title="{{ t('Schließen') }}">✕</button>
    </div>
    <div class="schau-buehne" id="schau-buehne"></div>
    <button class="schau-pfeil links" id="schau-zurueck"
            title="{{ t('Zurück') }}">‹</button>
    <button class="schau-pfeil rechts" id="schau-vor" title="Weiter">›</button>
    <div class="schau-leiste" id="schau-leiste"></div>
  </div>

  <div class="anruf-ruf" id="anruf-ruf" hidden>
    <span class="klingel-punkt"></span>
    <div class="ar-text">
      <div class="ar-titel" id="ruf-titel">{{ t("Anruf") }}</div>
      <div class="ar-sub" id="ruf-sub"></div>
    </div>
    <button class="btn ghost klein" id="ruf-ablehnen">Ablehnen</button>
    <button class="btn klein" id="ruf-annehmen">Annehmen</button>
  </div>

  <div class="anruf-fenster" id="anruf-fenster" hidden>
    <div class="anruf-kopf">
      <span id="anruf-titel">{{ t("Anruf") }}</span>
      <span class="anruf-dauer" id="anruf-dauer">0:00</span>
    </div>
    <div class="anruf-kacheln" id="anruf-kacheln"></div>
    <div class="anruf-leiste">
      <button class="anruf-knopf" id="btn-anruf-stumm" title="{{ t('Mikrofon') }}">🎤</button>
      <button class="anruf-knopf" id="btn-anruf-kamera" title="{{ t('Kamera') }}" hidden>📷</button>
      <button class="anruf-knopf auflegen" id="btn-anruf-auflegen"
              title="{{ t('Auflegen') }}">📵</button>
    </div>
  </div>

  <div class="galerie" id="galerie" hidden>
    <div class="galerie-kopf">
      <span id="galerie-titel">{{ t("Galerie") }}</span>
      <span style="flex:1"></span>
      <button class="mini-btn" id="galerie-neu" hidden>{{ t("＋ Bild hinzufügen") }}</button>
      <button class="icon-btn" id="galerie-zu" title="{{ t('Schließen') }}">✕</button>
    </div>
    <div class="galerie-raster" id="galerie-raster"></div>
    <div class="galerie-faden" id="galerie-faden" hidden></div>
  </div>

  <div id="modal-root"></div>

  <script src="{{ statisch('i18n.js') }}"></script>
  <script src="{{ statisch('socket.io.min.js') }}"></script>
  <script src="{{ statisch('app.js') }}"></script>
</body>
</html>
