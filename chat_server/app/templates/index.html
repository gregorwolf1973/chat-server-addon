<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1416">
  <title>Chat</title>
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <link rel="icon" href="{{ statisch('favicon.png') }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ statisch('icon-180.png') }}">
  <link rel="stylesheet" href="{{ statisch('style.css') }}">
</head>
<body data-base="{{ base }}" data-me="{{ me.id }}" data-name="{{ me.display_name }}"
      data-admin="{{ 1 if me.is_admin else 0 }}" data-vapid="{{ vapid }}">

  <div class="app" id="app">
    <aside class="sidebar">
      <header>
        <span class="brand">Chat</span>
        <button class="icon-btn" id="btn-new" title="Neue Unterhaltung">+ Neu</button>
      </header>
      <nav class="reiter" id="reiter">
        <button class="reiter-knopf" data-reiter="chats">Unterhaltungen<span
          class="reiter-zahl" id="zahl-chats"></span></button>
        <button class="reiter-knopf" data-reiter="karten">Karten<span
          class="reiter-zahl" id="zahl-karten"></span></button>
        <button class="reiter-knopf" data-reiter="stimmung">Stimmung<span
          class="reiter-zahl" id="zahl-stimmung"></span></button>
        <button class="reiter-knopf" data-reiter="termine">Termine<span
          class="reiter-zahl" id="zahl-termine"></span></button>
        <button class="reiter-knopf" data-reiter="zugesagt">Zugesagt<span
          class="reiter-zahl" id="zahl-zugesagt"></span></button>
      </nav>
      <div class="seiten-scroll">
        <section class="abschnitt" data-inhalt="chats">
          <div class="room-list" id="rooms"></div>
        </section>
        <section class="abschnitt" data-inhalt="karten">
          <div class="abschnitt-aktion">
            <button class="mini-btn" id="btn-live">Standort teilen</button></div>
          <div id="karten-liste"></div>
        </section>
        <section class="abschnitt" data-inhalt="stimmung">
          <div class="abschnitt-aktion">
            <button class="mini-btn" id="btn-stimmung">Stimmung setzen</button></div>
          <div id="stimmung-liste"></div>
        </section>
        <section class="abschnitt" data-inhalt="termine">
          <div id="termin-liste"></div>
        </section>
        <section class="abschnitt" data-inhalt="zugesagt">
          <div id="zugesagt-liste"></div>
        </section>
      </div>
      <footer>
        <span class="dot on"></span>
        <span id="me-name">{{ me.display_name }}</span>
        <span style="flex:1"></span>
        <button class="icon-btn" id="btn-media" title="Bilder und Dateien">Medien</button>
        <button class="icon-btn" id="btn-push" title="Benachrichtigungen einschalten">Push</button>
        <button class="icon-btn" id="btn-settings" title="Einstellungen">…</button>
      </footer>
    </aside>

    <main class="chat">
      <div class="chat-header" id="chat-header" hidden>
        <button class="icon-btn back" id="btn-back">←</button>
        <span id="room-avatar"></span>
        <div>
          <div class="title" id="room-title"></div>
          <div class="sub" id="room-sub"></div>
        </div>
        <span style="flex:1"></span>
        <button class="icon-btn" id="btn-room-media" title="Bilder und Dateien dieser Unterhaltung">Medien</button>
        <button class="icon-btn" id="btn-invite" hidden>+ Person</button>
      </div>

      <div class="messages" id="messages">
        <div class="empty">Wähle links eine Unterhaltung oder starte mit „+ Neu“ eine neue.</div>
      </div>
      <div class="typing" id="typing"></div>

      <div class="reply-bar" id="reply-bar" hidden>
        <div class="reply-body">
          <span class="reply-label">Antwort an</span>
          <span id="reply-author"></span>
          <span id="reply-text"></span>
        </div>
        <button class="icon-btn" id="reply-cancel" title="Antwort verwerfen">✕</button>
      </div>

      <div class="anhang-menue" id="anhang-menue" hidden>
        <button type="button" data-tat="datei"><span>📎</span>Datei oder Bild</button>
        <button type="button" data-tat="ort"><span>📍</span>Standort senden</button>
        <button type="button" data-tat="live"><span>🛰️</span>Standort live teilen</button>
        <button type="button" data-tat="abstimmung"><span>📊</span>Abstimmung</button>
        <button type="button" data-tat="event"><span>📅</span>Einladung</button>
      </div>

      <div class="composer" id="composer" hidden>
        <button class="icon-btn" id="btn-emoji" title="Emoji">🙂</button>
        <button class="icon-btn" id="btn-anhang" title="Anhängen">📎</button>
        <input type="file" id="file-input" multiple hidden>
        <textarea id="input" rows="1" enterkeyhint="send"
                  placeholder="Nachricht schreiben…"></textarea>
        <button class="send" id="btn-send">Senden</button>
      </div>
    </main>
  </div>

  <div id="modal-root"></div>

  <script src="{{ statisch('socket.io.min.js') }}"></script>
  <script src="{{ statisch('app.js') }}"></script>
</body>
</html>
