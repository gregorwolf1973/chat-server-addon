<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Anmelden</title>
  <link rel="icon" href="{{ statisch('favicon.png') }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ statisch('icon-180.png') }}">
  <link rel="stylesheet" href="{{ statisch('style.css') }}">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img class="brand-logo" src="{{ statisch('icon-192.png') }}" alt="">
      <h1>Wosislos</h1>
      <p class="sub">Melde dich mit deinem Konto an.</p>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <form method="post">
        <div class="field">
          <label for="username">Benutzername</label>
          <input id="username" name="username" autocomplete="username" autofocus required>
        </div>
        <div class="field">
          <label for="password">Passwort</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn" type="submit">Anmelden</button>
      </form>
      {% if registration_open %}
      <p class="hint">Noch kein Konto?
        <a href="{{ url_for('register_page') }}">Zugang beantragen</a></p>
      {% endif %}
    </div>
  </div>
</body>
</html>
