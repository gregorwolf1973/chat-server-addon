<!DOCTYPE html>
<html lang="{{ sprache }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ t("Anmelden") }}</title>
  <link rel="icon" href="{{ statisch('favicon.png') }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ statisch('icon-180.png') }}">
  <link rel="stylesheet" href="{{ statisch('style.css') }}">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img class="brand-logo" src="{{ statisch('icon-192.png') }}" alt="">
      <h1>{{ anzeigename }}</h1>
      <p class="sub">{{ t("Melde dich mit deinem Konto an.") }}</p>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <form method="post">
        <div class="field">
          <label for="username">{{ t("Benutzername") }}</label>
          <input id="username" name="username" autocomplete="username" autofocus required>
        </div>
        <div class="field">
          <label for="password">{{ t("Passwort") }}</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn" type="submit">{{ t("Anmelden") }}</button>
      </form>
      <p class="hint"><a href="{{ url_for('passwort_vergessen') }}">{{ t("Passwort vergessen?") }}</a></p>
      {% if registration_open %}
      <p class="hint">{{ t("Noch kein Konto?") }} <a href="{{ url_for('register_page') }}">{{ t("Zugang beantragen") }}</a></p>
      {% endif %}
      <p class="sprachwahl">
        <a href="?lang=de"{% if sprache == 'de' %} class="jetzt"{% endif %}>Deutsch</a>
        <span>·</span>
        <a href="?lang=en"{% if sprache == 'en' %} class="jetzt"{% endif %}>English</a>
      </p>
    </div>
  </div>
  <script src="{{ statisch('login.js') }}"></script>
</body>
</html>
