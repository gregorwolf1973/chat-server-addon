name: Chat Server
version: "0.46.0"
slug: chat_server
# Fertige Abbilder aus der GitHub-Registrierung. Ohne diese Zeile baut
# jedes Geraet selbst - auf einem Pi dauert das viele Minuten.
image: ghcr.io/gregorwolf1973/{arch}-addon-chat_server
description: Selbstgehosteter Messenger mit Gruppen, Dateiversand und Push-Benachrichtigungen
url: https://github.com/gregorwolf1973/chat-server-addon
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:forum
panel_title: Chat
# Geteilte Dateien koennen viele Gigabyte werden - sie gehoeren nicht in jedes
# Backup. Datenbank, Schluessel und Profilbilder bleiben enthalten.
backup_exclude:
  - uploads
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Direktzugriff für externen Zugang (Cloudflare Tunnel)
options:
  admin_user: admin
  admin_password: bitte-aendern
  external_url: ""
  api_token: ""
  max_upload_mb: 25
  allow_registration: true
  sprache: browser
  retention_days: 0
  stun_server: "stun:stun.l.google.com:19302"
  turn_server: ""
  turn_username: ""
  turn_password: ""
  log_level: info
schema:
  admin_user: str
  admin_password: password
  external_url: str?
  api_token: str?
  max_upload_mb: int(1,200)
  allow_registration: bool
  sprache: list(browser|de|en)
  retention_days: int(0,3650)
  stun_server: str?
  turn_server: str?
  turn_username: str?
  turn_password: password?
  log_level: list(debug|info|warning|error)
